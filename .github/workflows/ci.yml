name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
    NEXT_TELEMETRY_DISABLED: 1
    NEXT_PUBLIC_APP_URL: http://localhost:3000
    NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
    NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

jobs:
    quality:
        name: Quality (typecheck · lint · format)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm format:check

    test:
        name: Unit & Integration Tests
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests with coverage
              run: pnpm test:coverage

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage
                  path: coverage/
                  retention-days: 14

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: quality
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build (Standalone)
              run: pnpm build

    e2e:
        name: E2E Tests (Playwright)
        runs-on: ubuntu-latest
        needs: quality
        # E2E nur auf PRs/main — spart Minuten auf Feature-Branches.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Get Playwright version
              id: pw-version
              run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> $GITHUB_OUTPUT

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              id: pw-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

            - name: Install Playwright browsers
              if: steps.pw-cache.outputs.cache-hit != 'true'
              run: pnpm test:e2e:install

            - name: Install Playwright system deps (cached browsers)
              if: steps.pw-cache.outputs.cache-hit == 'true'
              run: pnpm exec playwright install-deps chromium

            - name: Build
              run: pnpm build

            - name: Run Playwright tests
              run: pnpm test:e2e --project=public
              env:
                  CI: 'true'

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

    audit:
        name: Security audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Audit production dependencies
              run: pnpm audit --prod --audit-level moderate
